<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña · SAFE</title><link rel="stylesheet" href="/auth.css"></head><body class="login-page"><main class="auth-card"><p class="auth-kicker">SAFE SECURITY</p><h1>Cambio obligatorio</h1><p>Esta contraseña es inicial o temporal. Elija una contraseña única de al menos 15 caracteres antes de acceder a los datos. No hay MFA implementado.</p><form id="passwordForm"><label>Contraseña actual<input name="current" type="password" autocomplete="current-password" required></label><label>Contraseña nueva<input name="password" type="password" autocomplete="new-password" minlength="15" required></label><p id="passwordStatus" role="alert"></p><button>Actualizar e iniciar sesión</button></form><a href="/login">Volver al acceso</a></main><script src="/password.js"></script></body></html>
